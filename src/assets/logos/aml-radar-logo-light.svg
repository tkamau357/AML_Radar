<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for radar sweep -->
    <linearGradient id="sweepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4299E1;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent background (for light backgrounds) -->
  
  <!-- Radar circles -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#1A365D" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="200" r="110" fill="none" stroke="#1A365D" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="200" r="70" fill="none" stroke="#1A365D" stroke-width="2" opacity="0.5"/>
  <circle cx="200" cy="200" r="30" fill="none" stroke="#1A365D" stroke-width="2" opacity="0.6"/>
  
  <!-- Radar cross lines -->
  <line x1="50" y1="200" x2="350" y2="200" stroke="#1A365D" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="50" x2="200" y2="350" stroke="#1A365D" stroke-width="2" opacity="0.5"/>
  
  <!-- Diagonal lines -->
  <line x1="94" y1="94" x2="306" y2="306" stroke="#1A365D" stroke-width="1" opacity="0.3"/>
  <line x1="306" y1="94" x2="94" y2="306" stroke="#1A365D" stroke-width="1" opacity="0.3"/>
  
  <!-- Radar sweep (pie slice) -->
  <path d="M200,200 L200,50 A150,150 0 0,1 329,94 Z" fill="url(#sweepGradient)" opacity="0.8"/>
  
  <!-- Detection points -->
  <circle cx="245" cy="120" r="8" fill="#48BB78" filter="url(#glow)"/>
  <circle cx="280" cy="160" r="6" fill="#ED8936" filter="url(#glow)"/>
  <circle cx="230" cy="85" r="7" fill="#F56565" filter="url(#glow)"/>
  
  <!-- Center dot -->
  <circle cx="200" cy="200" r="8" fill="#1A365D"/>
  <circle cx="200" cy="200" r="4" fill="#4299E1"/>
</svg>
