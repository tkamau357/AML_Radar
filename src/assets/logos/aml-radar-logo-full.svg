<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for radar sweep -->
    <linearGradient id="sweepGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#4299E1;stop-opacity:0.3"/>
    </linearGradient>
    
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A365D"/>
      <stop offset="100%" style="stop-color:#2C5282"/>
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(20, 20)">
    <!-- Background circle -->
    <circle cx="80" cy="80" r="75" fill="url(#bgGradient)"/>
    
    <!-- Radar circles -->
    <circle cx="80" cy="80" r="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.3"/>
    <circle cx="80" cy="80" r="44" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <circle cx="80" cy="80" r="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <circle cx="80" cy="80" r="12" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Radar cross lines -->
    <line x1="20" y1="80" x2="140" y2="80" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    <line x1="80" y1="20" x2="80" y2="140" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5"/>
    
    <!-- Radar sweep -->
    <path d="M80,80 L80,20 A60,60 0 0,1 132,58 Z" fill="url(#sweepGradient)" opacity="0.8"/>
    
    <!-- Detection points -->
    <circle cx="98" cy="48" r="4" fill="#48BB78" filter="url(#glow)"/>
    <circle cx="112" cy="64" r="3" fill="#ED8936" filter="url(#glow)"/>
    <circle cx="92" cy="34" r="3.5" fill="#F56565" filter="url(#glow)"/>
    
    <!-- Center dot -->
    <circle cx="80" cy="80" r="4" fill="#FFFFFF"/>
    <circle cx="80" cy="80" r="2" fill="#4299E1"/>
  </g>
  
  <!-- Text: AML -->
  <text x="200" y="95" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#1A365D">AML</text>
  
  <!-- Text: RADAR -->
  <text x="200" y="150" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="bold" fill="#2C5282">RADAR</text>
  
  <!-- Tagline -->
  <text x="200" y="180" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#718096">Anti-Money Laundering Intelligence Platform</text>
</svg>
