  <line x1="32" y1="8" x2="32" y2="56" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  
  <!-- Sweep -->
  <path d="M32,32 L32,8 A24,24 0 0,1 53,21 Z" fill="url(#sweepGradient)" opacity="0.8"/>
  
  <!-- Detection points -->
  <circle cx="39" cy="19" r="2.5" fill="#48BB78"/>
