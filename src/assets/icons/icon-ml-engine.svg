<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#48BB78"/>
      <stop offset="100%" style="stop-color:#38A169"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#mlGradient)"/>
  
  <!-- Brain/Neural Network Icon -->
  <!-- Left hemisphere -->
  <path d="M20,20 C15,20 12,25 12,32 C12,39 15,44 20,44" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M20,24 C17,24 15,27 15,32 C15,37 17,40 20,40" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Right hemisphere -->
  <path d="M44,20 C49,20 52,25 52,32 C52,39 49,44 44,44" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M44,24 C47,24 49,27 49,32 C49,37 47,40 44,40" 
        fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Connection line -->
  <line x1="20" y1="32" x2="44" y2="32" stroke="#FFFFFF" stroke-width="2"/>
  
  <!-- Neural nodes -->
  <circle cx="24" cy="26" r="3" fill="#FFFFFF"/>
  <circle cx="24" cy="38" r="3" fill="#FFFFFF"/>
  <circle cx="32" cy="32" r="4" fill="#FFFFFF"/>
  <circle cx="40" cy="26" r="3" fill="#FFFFFF"/>
  <circle cx="40" cy="38" r="3" fill="#FFFFFF"/>
  
  <!-- Connections -->
  <line x1="24" y1="26" x2="32" y2="32" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="38" x2="32" y2="32" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="32" x2="40" y2="26" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <line x1="32" y1="32" x2="40" y2="38" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
</svg>
