    <circle cx="8" cy="8" r="5" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Gear teeth -->
    <rect x="6" y="-2" width="4" height="4" fill="#FFFFFF"/>
    <rect x="6" y="16" width="4" height="4" fill="#FFFFFF"/>
    <rect x="-2" y="6" width="4" height="4" fill="#FFFFFF"/>
    <rect x="16" y="6" width="4" height="4" fill="#FFFFFF"/>
