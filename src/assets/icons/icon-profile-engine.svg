<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="profileGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4299E1"/>
      <stop offset="100%" style="stop-color:#3182CE"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="url(#profileGradient)"/>
  
  <!-- User icon -->
  <circle cx="32" cy="22" r="8" fill="#FFFFFF"/>
  <path d="M18,48 C18,38 24,32 32,32 C40,32 46,38 46,48" 
