<div class="audit-filters mb-4 p-4 bg-white rounded-lg shadow-sm">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">User Email</label>
      <input
        type="text"
        [(ngModel)]="userEmailFilter"
        placeholder="Search by email"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Action</label>
      <select
        [(ngModel)]="actionFilter"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
        <option *ngFor="let opt of actionOptions" [value]="opt.value">{{ opt.label }}</option>
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
      <input
        type="date"
        [(ngModel)]="startDateFilter"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">End Date</label>
      <input
        type="date"
        [(ngModel)]="endDateFilter"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>
    <div class="flex items-end gap-2">
      <button
        (click)="onSearch()"
        class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors"
      >
        Search
      </button>
      <button
        (click)="clearFilters()"
        class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition-colors"
      >
        Clear
      </button>
    </div>
  </div>
</div>

<app-dynamic-tables
  pageTitle="Audit Trail"
  pageSubtitle="View system activity and audit logs"
  TableSubtitle="Audit logs"
  [showAddButton]="false"
  [columns]="columns"
  [data]="audits"
  [actions]="actions"
  [headerActions]="headerActions"
  [isLoading]="isLoading"
  noRecordsMessage="No audit logs found."
  [showExcel]="true"
  [showPdf]="true"
  [totalDataCount]="totalElements"
  [pageIndex]="pageIndex"
  [pageSize]="pageSize"
  (paginationChange)="onPaginationChange($event)"
></app-dynamic-tables>
