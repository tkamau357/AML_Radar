<main class="error-page error-page--failure">
  <section class="error-page__panel" aria-labelledby="page500-title">
    <div class="error-page__code" aria-hidden="true">
      <span class="error-page__code-number">500</span>
    </div>
    <div class="error-page__content">
      <span class="error-page__eyebrow">System interruption</span>
      <h1 id="page500-title" class="error-page__title">Something went wrong</h1>
      <p class="error-page__message">The service could not complete that request. Return home and try again, or sign in for help.</p>
      <div class="error-page__actions">
        <button type="button" class="error-page__button" (click)="goHome()">Go to home <span aria-hidden="true">-&gt;</span></button>
        <a routerLink="/authentication/sign-in" class="error-page__button error-page__button--secondary">Need help?</a>
      </div>
    </div>
  </section>
</main>
