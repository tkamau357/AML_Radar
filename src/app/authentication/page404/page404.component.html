<main class="error-page error-page--missing">
  <section class="error-page__panel" aria-labelledby="page404-title">
    <div class="error-page__code" aria-hidden="true">
      <span class="error-page__code-number">404</span>
    </div>
    <div class="error-page__content">
      <span class="error-page__eyebrow">Route not found</span>
      <h1 id="page404-title" class="error-page__title">That page has moved</h1>
      <p class="error-page__message">The address may be outdated, or the page may no longer exist. Return to the previous screen and keep working.</p>
      <div class="error-page__actions">
        <button type="button" class="error-page__button" (click)="goBack()"><span aria-hidden="true">&lt;-</span> Go back</button>
      </div>
    </div>
  </section>
</main>
