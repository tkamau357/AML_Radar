<section class="min-h-screen bg-gray-100 pt-17 pl-0 lg:pl-64 transition-all">
  <div class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-xl px-6 text-center">
      
      <form class="flex flex-col items-center">
        <span class="text-[40px] font-bold !text-[#2A5CAA]">
          404
        </span>

        <span class="text-[20px] p-b-5 font-bold !text-[#00A5E4]">
          Page Not Found
        </span>

        <span class="text-sm !text-[#000]">
          The Page You Are Looking For does not Exist!
        </span>

        <div class="mt-4">
          <button type="button" (click)="goBack()" class="flex items-center gap-2 px-4 py-2 rounded-lg text-[15px] font-medium text-white bg-[#2A5CAA]">
            ← Back
          </button>
        </div>
      </form>

    </div>
  </div>
</section>
