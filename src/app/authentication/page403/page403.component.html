<main class="error-page error-page--forbidden">
    <section class="error-page__panel" aria-labelledby="page403-title">
        <div class="error-page__code" aria-hidden="true">
            <span class="error-page__code-number">403</span>
        </div>
        <div class="error-page__content">
            <span class="error-page__eyebrow">Permission denied</span>
            <h1 id="page403-title" class="error-page__title">You cannot access this page</h1>
            <p class="error-page__message">Your account does not have the required permission. Contact an administrator if you believe this is a mistake.</p>
            <div class="error-page__actions">
                <button type="button" class="error-page__button" (click)="goBack()"><span aria-hidden="true">&lt;-</span> Go back</button>
            </div>
        </div>
    </section>
</main>
