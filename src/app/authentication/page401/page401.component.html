<main class="error-page error-page--unauthorized">
    <section class="error-page__panel" aria-labelledby="page401-title">
        <div class="error-page__code" aria-hidden="true">
            <span class="error-page__code-number">401</span>
        </div>
        <div class="error-page__content">
            <span class="error-page__eyebrow">Authentication required</span>
            <h1 id="page401-title" class="error-page__title">Unauthorized access</h1>
            <p class="error-page__message">We could not validate your credentials. Sign in again to continue securely.</p>
            <div class="error-page__actions">
                <button type="button" class="error-page__button" (click)="goToLogin()">Go to sign in <span aria-hidden="true">-&gt;</span></button>
            </div>
        </div>
    </section>
</main>
