<div class="card-wrapper cursor-pointer" (click)="onClick()">
    <div class="card-content">
        <div class="card-text">
            <div class="card-title">{{cardData?.title}}</div>
            <div class="card-data">{{cardData?.count}}</div>
        </div>
        <div class="card-icon">
            <img src="assets/images/icons/{{cardData?.icon}}" alt="icon">
        </div>
    </div>
</div>
